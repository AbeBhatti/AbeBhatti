<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="800" height="160">
  <defs>
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="800" height="20">
      <line x1="0" y1="0" x2="800" y2="0" stroke="#00e5ff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      @keyframes dropLetter {
        from {
          opacity: 0;
          transform: translateY(-22px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeSubtitle {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 1; }
      }
      .name-letter {
        opacity: 0;
        animation: dropLetter 0.42s ease-out forwards;
        transform-box: fill-box;
        transform-origin: center;
      }
      .subtitle {
        opacity: 0;
        animation: fadeSubtitle 0.65s ease-out forwards;
        animation-delay: 2.1s;
      }
      .star {
        fill: #ffffff;
        animation: twinkle 2.4s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="800" height="160" fill="#060d1a"/>
  <rect width="800" height="160" fill="url(#scanlines)"/>

  <g class="stars" aria-hidden="true">
    <circle class="star" cx="52" cy="28" r="1.2" style="animation-delay:0s;animation-duration:2.1s"/>
    <circle class="star" cx="118" cy="44" r="1" style="animation-delay:0.4s;animation-duration:2.8s"/>
    <circle class="star" cx="186" cy="18" r="1.1" style="animation-delay:0.9s;animation-duration:2.3s"/>
    <circle class="star" cx="248" cy="52" r="0.9" style="animation-delay:0.2s;animation-duration:3.1s"/>
    <circle class="star" cx="312" cy="26" r="1.2" style="animation-delay:1.1s;animation-duration:2.5s"/>
    <circle class="star" cx="378" cy="48" r="1" style="animation-delay:0.6s;animation-duration:2.9s"/>
    <circle class="star" cx="442" cy="22" r="0.85" style="animation-delay:1.4s;animation-duration:2.2s"/>
    <circle class="star" cx="508" cy="56" r="1.15" style="animation-delay:0.3s;animation-duration:2.6s"/>
    <circle class="star" cx="572" cy="30" r="1" style="animation-delay:0.8s;animation-duration:3s"/>
    <circle class="star" cx="638" cy="46" r="0.95" style="animation-delay:1.6s;animation-duration:2.4s"/>
    <circle class="star" cx="702" cy="24" r="1.1" style="animation-delay:0.5s;animation-duration:2.7s"/>
    <circle class="star" cx="748" cy="58" r="0.9" style="animation-delay:1.2s;animation-duration:2.85s"/>
    <circle class="star" cx="88" cy="112" r="1" style="animation-delay:0.15s;animation-duration:2.55s"/>
    <circle class="star" cx="156" cy="132" r="0.85" style="animation-delay:1s;animation-duration:3.05s"/>
    <circle class="star" cx="224" cy="98" r="1.2" style="animation-delay:0.7s;animation-duration:2.35s"/>
    <circle class="star" cx="356" cy="118" r="0.9" style="animation-delay:1.3s;animation-duration:2.95s"/>
    <circle class="star" cx="468" cy="104" r="1.05" style="animation-delay:0.45s;animation-duration:2.65s"/>
    <circle class="star" cx="596" cy="128" r="0.95" style="animation-delay:1.5s;animation-duration:2.75s"/>
    <circle class="star" cx="684" cy="96" r="1.1" style="animation-delay:0.25s;animation-duration:2.45s"/>
    <circle class="star" cx="772" cy="122" r="0.8" style="animation-delay:1.7s;animation-duration:3.15s"/>
  </g>

  <line x1="0" y1="1" x2="800" y2="1" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="0" y1="159" x2="800" y2="159" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="2"/>

  <text x="400" y="68" text-anchor="middle" font-family="Courier New, Courier, monospace" font-weight="bold" font-size="42" fill="#00e5ff">
    <tspan class="name-letter" style="animation-delay:0s">A</tspan><tspan class="name-letter" style="animation-delay:0.12s">B</tspan><tspan class="name-letter" style="animation-delay:0.24s">R</tspan><tspan class="name-letter" style="animation-delay:0.36s">A</tspan><tspan class="name-letter" style="animation-delay:0.48s">H</tspan><tspan class="name-letter" style="animation-delay:0.6s">A</tspan><tspan class="name-letter" style="animation-delay:0.72s">M</tspan><tspan class="name-letter" style="animation-delay:0.84s">&#32;</tspan><tspan class="name-letter" style="animation-delay:0.96s">B</tspan><tspan class="name-letter" style="animation-delay:1.08s">H</tspan><tspan class="name-letter" style="animation-delay:1.2s">A</tspan><tspan class="name-letter" style="animation-delay:1.32s">T</tspan><tspan class="name-letter" style="animation-delay:1.44s">T</tspan><tspan class="name-letter" style="animation-delay:1.56s">I</tspan>
  </text>

  <text class="subtitle" x="400" y="92" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#5fcfcf">CS @ SANTA CLARA UNIVERSITY · AI / ML · FULL-STACK</text>

  <!-- Badges: total width 428px (118+18+170+18+104), centered at x=400 ’ x0=186 -->
  <g font-family="Courier New, Courier, monospace" font-size="11" fill="#00e5ff">
    <rect x="186" y="108" width="118" height="22" rx="3" fill="none" stroke="#00e5ff" stroke-width="1"/>
    <text x="245" y="123.5" text-anchor="middle">[ PORTFOLIO ]</text>
    <rect x="322" y="108" width="170" height="22" rx="3" fill="none" stroke="#00e5ff" stroke-width="1"/>
    <text x="407" y="123.5" text-anchor="middle">abrahambhatti.vercel.app</text>
    <rect x="510" y="108" width="104" height="22" rx="3" fill="none" stroke="#00e5ff" stroke-width="1"/>
    <text x="562" y="123.5" text-anchor="middle">[ LINKEDIN ]</text>
  </g>
</svg>
